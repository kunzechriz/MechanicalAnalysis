<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MechanicalDesign</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="background-shape shape-1"></div>
<div class="background-shape shape-2"></div>

<div class="main-container">
    <header class="glass-header">
        <div>
            <h1>MechanicalDesign</h1>
            <small>Topology Optimization and Analysation</small>
        </div>
        <div id="connection-status">System Ready</div>
    </header>

    <div id="dashboard-view" class="dashboard-grid">
        <div class="glass-card clickable" onclick="startNewProject()">
            <div class="icon-title">
                <div class="card-icon">＋</div>
                <h3>Neues Projekt</h3>
            </div>
            <p>Starte mit leeren Struktur.</p>
        </div>

        <div id="btn-open-project" class="glass-card clickable" onclick="loadAndShowProjects()">
            <div class="icon-title">
                <div class="card-icon">📂</div>
                <h3>Öffne gespeicherte Projekt</h3>
            </div>
        </div>
        <div id="saved-projects-wrapper" class="glass-card"
             style="margin-top: 20px; display: none; transition: all 0.3s ease;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; border-bottom: 1px solid rgba(0,0,0,0.1); padding-bottom: 10px;">
                <h3 style="margin:0;">Gespeicherte Projekte:</h3>
                <button class="glass-btn-small danger" onclick="hideProjectList()">Schließen ✕</button>
            </div>

            <div id="project-list" style="display: flex; flex-wrap: wrap; gap: 15px;"></div>
        </div>
        <div class="glass-card clickable" id="upload-widget">
            <div class="icon-title">
                <div class="card-icon">📁</div>
                <h3>Upload Object</h3>
            </div>
            <p>Importieren von Geometrien.</p>
        </div>
    </div>

    <div id="static-analysis-view" style="display: none;">
        <button class="glass-btn-small" onclick="switchView('dashboard')">← Zurück</button>

        <div class="analysis-container glass-card"
             style="margin-top: 20px; display: flex; gap: 30px; align-items: flex-start;">

            <div class="controls-panel" style="width: 300px; flex-shrink: 0;">
                <h2>Parameter</h2>
                <hr style="border: 0; border-top: 1px solid rgba(0,0,0,0.1); margin-bottom: 20px;">

                <div class="control-group">
                    <label>Breite: <span id="val-width">40</span></label>
                    <input type="range" id="slider-width" min="5" max="100" value="40" class="styled-slider">
                </div>

                <div class="control-group">
                    <label>Höhe: <span id="val-height">10</span></label>
                    <input type="range" id="slider-height" min="3" max="50" value="10" class="styled-slider">
                </div>

                <div class="control-group">
                    <label>Geschwindigkeit:</label>
                    <select id="select-quality" class="glass-select" style="width: 100%; margin-top: 5px;">
                        <option value="0.02">Schnell</option>
                        <option value="0.01" selected>Ausgewogen</option>
                        <option value="0.005">Langsam</option>
                    </select>
                </div>

                <button class="glass-btn action-btn" onclick="triggerPythonSolver()">Gewichtsoptimierung starten</button>
                <button class="glass-btn action-btn" onclick="triggerKinematicAnalysis()">Verformung zeigen</button>
                <button class="glass-btn action-btn" onclick="triggerForceAnalysis()">Kraftanalyse</button>
            </div>

            <div class="canvas-wrapper" style="flex-grow: 1; position: relative;">

                <div class="canvas-toolbar glass-card"
                     style="padding: 10px; margin-bottom: 10px; display: flex; gap: 10px; align-items: center;">

                    <label><b>Werkzeuge:</b></label>
                    <select id="tool-select" class="glass-select">
                        <option value="fixed">Festlager</option>
                        <option value="roller">Loslager</option>
                        <option value="force">Kraft</option>
                        <option value="eraser">Löschen</option>
                    </select>

                    <div style="width: 1px; height: 20px; background: #ccc; margin: 0 10px;"></div>

                    <label><b>Kraft:</b> <span id="val-force">1000</span>N</label>
                    <input type="range" id="slider-force" min="100" max="2000" step="50" value="1000"
                           class="styled-slider" style="width: 100px;">

                    <div style="width: 1px; height: 20px; background: #ccc; margin: 0 10px;"></div>

                    <label><b>Ziel:</b> <span id="val-mass">50</span>%</label>
                    <input type="range" id="slider-mass" min="10" max="100" value="50" class="styled-slider"
                           style="width: 100px;">

                    <button class="glass-btn-small danger" onclick="resetAnalysis()" style="margin-left: auto;">↺
                        Zurücksetzen
                    </button>
                </div>

                <canvas id="structureCanvas" width="800" height="400"
                        style="background: rgba(255,255,255,0.5); border-radius: 15px; cursor: crosshair; display: block;"></canvas>

                <div id="save-container" class="glass-card"
                     style="position: absolute; bottom: 20px; right: 20px; padding: 8px; z-index: 100; transition: all 0.3s ease;">

                    <div id="save-initial" style="display: block;">
                        <button class="glass-btn-small" onclick="toggleSaveUI(true)"
                                style="background: rgba(16, 185, 129, 0.2); width: 200px; justify-content: center;">
                            Speichern
                        </button>
                    </div>
                    <button class="glass-btn-small" onclick="exportCanvasAsPNG()"
                            style="margin-left: auto; margin-right: 5px; background: rgba(59, 130, 246, 0.2); width: 200px; justify-content: center;">
                        Aktelle Ansicht exportieren
                    </button>
                    <div id="save-form" style="display: none; align-items: center; gap: 5px;">
                        <input type="text" id="project-name" placeholder="Name..."
                               style="background: rgba(255,255,255,0.8); border: 1px solid #ccc; padding: 5px; border-radius: 5px; width: 120px;">

                        <button class="glass-btn-small" onclick="triggerSaveProject()" style="background: rgba(16, 185, 129, 0.6); color: white;">✓</button>
                        <button class="glass-btn-small danger" onclick="toggleSaveUI(false)" style="padding: 5px 8px;">✕</button>
                    </div>
                </div>

                <div class="terminal-window">
                    <div class="terminal-header">
                        <span>System Log</span>
                        <span id="status-dot" class="dot"></span>
                    </div>
                    <div id="terminal-content" class="terminal-content">
                        Ready for input...
                    </div>
                </div>
            </div>
        </div>
    </div>

</div>

<script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
